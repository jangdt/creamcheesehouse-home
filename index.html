<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크림치즈하우스</title>
<meta name="description" content="주식 투자를 시작하는 20대를 위한 콘텐츠를 만듭니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://creamcheesehouse.com/">
<meta property="og:title" content="크림치즈하우스">
<meta property="og:description" content="주식 투자를 시작하는 20대를 위한 콘텐츠를 만듭니다.">
<meta property="og:image" content="https://creamcheesehouse.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face { font-family: "BHS"; src: url("bhs.woff2") format("woff2"); font-display: swap; }
:root { --wall: #FFE14D; --ink: #151515; --sub: #302614; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--wall); color: var(--ink); }
body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
.wall { position: fixed; inset: 0; pointer-events: none; opacity: .6;
  background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300'%3E%3Cfilter id='p'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' seed='3'/%3E%3CfeColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0.09 0'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23p)'/%3E%3C/svg%3E"); }
.wrap { position: relative; max-width: 1120px; min-height: 100vh; margin: 0 auto; padding: 56px 24px;
  display: grid; grid-template-columns: 520px 1fr; gap: 24px; align-items: center; }
.pol { width: 520px; height: 520px; display: block; }
h1 { font-family: "BHS", sans-serif; font-weight: 400; font-size: 54px; line-height: 1.22; letter-spacing: -0.01em; word-break: keep-all; }
.mail { margin-top: 40px; font-size: 16px; color: var(--sub); }
.mail a { color: var(--ink); font-weight: 700; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: 1fr; gap: 24px; padding-block: 32px; justify-items: center; align-content: center; min-height: 100vh; min-height: 100svh; }
  .pol { width: 360px; height: 360px; max-width: 100%; }
  h1 { font-size: 38px; text-align: center; }
  .mail { text-align: center; margin-top: 32px; }
}
</style>
</head>
<body>
<div class="wall"></div>
<main class="wrap">
  <img class="pol" src="polaroid.webp" width="520" height="520" alt="크림치즈하우스 진행자">
  <div>
    <h1>주식 투자를 시작하는<br>20대를 위한 콘텐츠를 만듭니다.</h1>
    <p class="mail">협업 문의 <a href="mailto:contact@creamcheesehouse.com">contact@creamcheesehouse.com</a></p>
  </div>
</main>
</body>
</html>
